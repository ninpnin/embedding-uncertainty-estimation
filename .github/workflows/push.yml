name: Perform unit tests

on: [push]

jobs:
  unittest:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Compare Polya Gamma to Stan
      run: |
        python -m unittest tests.stancompare

    - name: Test convergence and GPU sampling accuracy
      run: |
        python -m unittest tests.pg_accuracy

    - name: Test Binomial aggregation with sufficient statistics
      run: |
        python -m unittest tests.suffstats_aggregation
